<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <section class="animated-section">
        <div class="character-side">
          <div class="head-section">
            <img class="head" src="Assets/HEAD.svg" alt="head" />
            <img
              class="eyes-default"
              src="Assets/EYES-DEFAULT.svg"
              alt="eyes"
            />
            <img
              class="mouth-default"
              src="Assets/MOUTH-DEFAULT.svg"
              alt="mouth"
            />
          </div>
          <div class="body-section">
            <img class="body-1" src="Assets/BODY-1.svg" alt="body-1" />
            <div class="both-hands">
              <img
                class="right-hand"
                src="Assets/RIGHT-HAND.svg"
                alt="right-hand"
              />
              <img
                class="left-hand"
                src="Assets/LEFT-HAND.svg"
                alt="left-hand"
              />

          </div>
        </div>
      </section>
      <section class="hero-section">
        <h1>Hi! this page is still in progress. Thank you for your patience</h1>
