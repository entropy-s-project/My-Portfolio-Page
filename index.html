<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <main>
      <!-- FIRST PAGE -->
      <section class="animated-section">
        <!-- Character section -->
        <div class="character-side">
          <!-- FACE -->
          <div class="head-section">
            <img class="head" src="Assets/HEAD.svg" alt="head" />
            <img
              class="eyes-default"
              src="Assets/EYES-DEFAULT.svg"
              alt="eyes"
            />
            <img
              class="mouth-default"
              src="Assets/MOUTH-DEFAULT.svg"
              alt="mouth"
            />
          </div>
          <!-- BODY -->
          <div class="body-section">
            <img class="body-1" src="Assets/BODY-1.svg" alt="body-1" />
            <div class="both-hands">
              <img
                class="right-hand"
                src="Assets/RIGHT-HAND.svg"
                alt="right-hand"
              />
              <img
                class="left-hand"
                src="Assets/LEFT-HAND.svg"
                alt="left-hand"
              />
            </div>
          </div>
        </div>
        <!-- MENU section -->
        <div class="menu-section">
          <a href="#portfolio-hero" class="menu-btn"
            ><img src="Assets/folder-icon.svg" alt="folder-icon" />Portfolio</a
          >
          <a href="https://github.com/entropy-s-project" class="menu-btn"
            ><img src="Assets/github-icon.svg" alt="github-icon" />Github</a
          >
        </div>
      </section>
      <!-- SECOND PAGE -->
      <section id="portfolio-hero" class="hero-section">
        <div class="about-section">
          <h1>Hi! I'm Abhilasha</h1>
          <p>
            A frontend developer currently building projects and improving my
            skills in web development.
          </p>
          <p>
            I enjoy creating interactive websites, experimenting with UI design,
            and learning how things work behind the scenes.
          </p>
        </div>
        <div class="about-character">
          <img class="body-2" src="Assets/ABOUT-ME/BODY-2.svg" alt="body-2" />
          <img class="head-2" src="Assets/ABOUT-ME/HEAD-2.svg" alt="head-2" />
          <img class="arm" src="Assets/ABOUT-ME/ARM.svg" alt="arm" />
          <img
            class="happy-face-1"
            src="Assets/ABOUT-ME/HAPPY-FACE-1.svg"
            alt="happy-face-1"
          />
        </div>
      </section>
    </main>
  </body>
</html>
